services:
  whatsapp-agent:
    build: .
    env_file: .env
    environment:
      WA_DB_PATH: /data/whatsapp_agent.db
    volumes:
      - wa-data:/data
      - ./examples/clinic:/app/examples/clinic:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  wa-data:
