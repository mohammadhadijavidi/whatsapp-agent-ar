name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke test CLI
        run: |
          whatsapp-agent-ar check
          whatsapp-agent-ar chat -m "مرحبا" -m "بكم التنظيف؟" -m "ابي احجز تنظيف"
          python examples/python_api.py
